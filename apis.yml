aid: bitgo
url: https://raw.githubusercontent.com/api-evangelist/bitgo/refs/heads/main/apis.yml
name: BitGo
kind: company
description: BitGo is an institutional digital-asset custody, wallet, staking, trading,
  and settlement infrastructure provider and qualified custodian. The BitGo Platform
  REST API v2 lets developers programmatically create and manage multi-signature and
  advanced-cryptography wallets, addresses, keychains, transactions and transfers,
  webhooks, spending policies, staking, and Go Network off-chain settlement across
  hundreds of coins and tokens, with an optional self-hosted Express signing proxy.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Digital Assets
- Custody
- Wallets
- Blockchain
- Crypto
- Staking
- Settlement
created: '2026-07-01'
modified: '2026-07-01'
