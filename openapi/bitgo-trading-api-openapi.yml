openapi: 3.2.0
info:
  title: BitGo Platform Trading API
  description: Representative specification of the BitGo Platform REST API v2 for institutional digital-asset custody.
  termsOfService: https://www.bitgo.com/legal/terms-of-service/
  contact:
    name: BitGo Support
    url: https://developers.bitgo.com/
  version: '2.0'
servers:
- url: https://app.bitgo.com/api/v2
  description: BitGo production platform
- url: https://app.bitgo-test.com/api/v2
  description: BitGo test environment
- url: http://localhost:3080/api/v2
  description: Self-hosted BitGo Express signing proxy (default port)
security:
- accessToken: []
tags:
- name: Trading
paths:
  /trading/settlements:
    get:
      operationId: listSettlements
      tags:
      - Trading
      summary: List settlements
      description: List off-chain settlements executed over the BitGo Go Network for the authenticated enterprise's trading accounts.
      parameters:
      - name: enterpriseId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of settlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementList'
components:
  schemas:
    Settlement:
      type: object
      properties:
        id:
          type: string
        enterpriseId:
          type: string
        status:
          type: string
          enum:
          - pending
          - completed
          - canceled
          - failed
        trades:
          type: array
          items:
            type: object
            additionalProperties: true
    SettlementList:
      type: object
      properties:
        settlements:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: accessToken
      description: 'BitGo access token passed as `Authorization: Bearer <token>`.'
