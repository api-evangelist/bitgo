description: >-
  FinOps view of BitGo platform spend. BitGo bills on a blend of dimensions:
  qualified-custody fees (basis points on assets under custody), per-wallet and
  per-transaction platform fees on self-managed wallets, staking commission
  taken as a percentage of rewards, and trading / settlement fees over the Go
  Network. On-chain network (miner / gas) fees are passed through separately
  from BitGo platform fees. Pricing is contractual, so cost management centers
  on tracking transaction volume, custody balances, and staking rewards against
  the negotiated agreement.
notes: >-
  BitGo does not publish public per-call rates; all figures are set by
  agreement. Distinguish BitGo platform fees from pass-through blockchain
  network fees when allocating cost. Verify against the customer's BitGo
  agreement during reconciliation.
