meters:
- name: assets_under_custody
  description: Digital assets held in qualified custody, billed as basis points per period.
  unit: usd_value
  aggregation: average
  dimensions:
  - enterprise
  - coin
- name: transactions
  description: On-chain transactions built and co-signed via the platform, billed per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - enterprise
  - wallet
  - coin
- name: network_fees_passthrough
  description: Blockchain miner / gas fees passed through, separate from BitGo platform fees.
  unit: usd_value
  aggregation: sum
  dimensions:
  - wallet
  - coin
- name: staking_rewards
  description: Staking rewards earned, against which BitGo takes a commission percentage.
  unit: usd_value
  aggregation: sum
  dimensions:
  - enterprise
  - coin
- name: settlements
  description: Off-chain settlements executed over the Go Network, billed per settlement.
  unit: settlements
  aggregation: sum
  dimensions:
  - enterprise
- name: wallets
  description: Active wallets under management, where per-wallet platform fees apply.
  unit: wallets
  aggregation: max
  dimensions:
  - enterprise
  - coin
principles:
- name: Visibility
  description: Reconcile BitGo invoices against transaction, custody-balance, and staking-reward exports; separate platform fees from pass-through network fees.
- name: Allocation
  description: Tag wallets and access tokens per team / product and map to internal cost centers via the enterprise and wallet dimensions.
- name: Optimization
  description: Batch payouts with sendmany to reduce per-transaction overhead and network fees; consolidate wallets; size custody balances to the negotiated tier.
- name: Accountability
  description: Assign owners per enterprise / wallet and review transaction volume, custody basis-point fees, and staking commission monthly against the agreement.
